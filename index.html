<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Skriblerne – ett ord om dagen">
    <title>Skriblerne</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="simple.css?v=20260818-1">
</head>
<body>
    <header class="site-header">
        <a href="." class="site-name">Skriblerne</a>
    </header>

    <main>
        <section class="daily-word" aria-labelledby="word-display">
            <p>Dagens ord</p>
            <h1 id="word-display" aria-live="polite">Laster</h1>
        </section>

        <section class="word-bank" aria-labelledby="word-bank-heading">
            <h2 id="word-bank-heading">Ord</h2>
            <form class="add-word-form" id="addWordForm">
                <label class="visually-hidden" for="newWord">Nytt ord</label>
                <input id="newWord" name="word" type="text" maxlength="80" placeholder="Nytt ord" autocomplete="off" enterkeyhint="done">
                <button type="submit" aria-label="Legg til ord">+</button>
            </form>
            <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
            <ol class="word-list" id="words-container" aria-label="Ord i rekkefølge"></ol>
        </section>
    </main>

    <dialog class="code-dialog" id="editCodeDialog">
        <form method="dialog" id="editCodeForm">
            <label for="editCodeInput">Kode</label>
            <input id="editCodeInput" name="password" type="password" autocomplete="current-password">
            <p id="editCodeMessage" role="status"></p>
            <div>
                <button type="button" id="cancelEditCodeButton">Avbryt</button>
                <button type="submit">Legg til</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/simple-app.js?v=20260818-1"></script>
</body>
</html>
